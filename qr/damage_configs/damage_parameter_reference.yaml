notes:
  enabled: false = 该污损不存在
  probability: 0~1，本张图出现概率
  instances: 整种污损重复叠加的层数；0 = 不出现
  severity: mild / medium / severe；仍可被 params 精确覆盖
  params.count: 一层内部元素数（划痕条数、斑点数、裂纹数、块数等）；0 = 不产生实际污损
  ratio_fields: 相对于整图或 QR 尺寸的比例；px 字段为像素值
